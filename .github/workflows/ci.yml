name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # `build:ci` skips `prisma migrate deploy` (which needs a live
        # DATABASE_URL); CI only needs the client generated for the build.
        run: npm run build:ci
        env:
          SESSION_SECRET: ci-placeholder-secret-not-used-at-runtime